server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=ancient-architecture

# Fixed MySQL connection (uses your Railway DB credentials)
spring.datasource.url=jdbc:mysql://[NEW MYSQLHOST]:[NEW MYSQLPORT]/[NEW MYSQLDATABASE]?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=[NEW MYSQLUSER]
spring.datasource.password=[NEW MYSQLPASSWORD]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate config (unchanged, works)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool (unchanged, works)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000