# 1. Server Configuration (Critical for Railway)
server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=ancient-architecture

# 2. MySQL Connection (Using Railway's built-in variables)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Railway-specific pool tuning (prevents startup crashes)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000